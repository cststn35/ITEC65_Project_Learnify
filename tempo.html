<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tailwind Temp Safelist</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-10 space-y-6">

  <!-- ================= BORDER COLORS ================= -->
  <div class="border-2 border-red-600"></div>
  <div class="border-2 border-red-500"></div>

  <div class="border-2 border-yellow-600"></div>
  <div class="border-2 border-yellow-500"></div>

  <div class="border-2 border-green-600"></div>
  <div class="border-2 border-green-500"></div>

  <div class="border-2 border-blue-600"></div>
  <div class="border-2 border-blue-500"></div>

  <div class="border-2 border-purple-600"></div>
  <div class="border-2 border-purple-500"></div>

  <div class="border-2 border-violet-600"></div>
  <div class="border-2 border-violet-500"></div>


  <!-- ================= BACKGROUND COLORS ================= -->
  <div class="bg-red-800"></div>
  <div class="bg-yellow-800"></div>
  <div class="bg-green-800"></div>
  <div class="bg-blue-800"></div>
  <div class="bg-purple-800"></div>
  <div class="bg-violet-800"></div>


  <!-- ================= BORDER LEFT WIDTH ================= -->
  <div class="border-l-6"></div>


  <!-- ================= WIDTH PERCENTAGES (IMPORTANT) ================= -->
  <div class="w-[0%]"></div>
  <div class="w-[10%]"></div>
  <div class="w-[20%]"></div>
  <div class="w-[30%]"></div>
  <div class="w-[40%]"></div>
  <div class="w-[50%]"></div>
  <div class="w-[60%]"></div>
  <div class="w-[70%]"></div>
  <div class="w-[80%]"></div>
  <div class="w-[90%]"></div>
  <div class="w-[100%]"></div>


  <!-- ================= ICON CLASSES (OPTIONAL BUT SAFE) ================= -->
  <i class="bx bx-bullseye"></i>
  <i class="bx bx-pencil"></i>
  <i class="bx bx-task"></i>
  <i class="bx bx-alarm"></i>
  <i class="bx bx-bell"></i>
  <i class="bx bx-down-arrow-alt"></i>
  <i class="bx bx-up-arrow-alt"></i>
  <i class="bx bxs-hot"></i>

</body>
</html>
